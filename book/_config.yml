title: "Estrato socioeconómico en Barranquilla — Proyecto final"
author: "María Carolina Cantillo Orozco (200179105) y Juan Camilo Oñoro Araujo (200177329)"
copyright: "2026"
logo: ""
execute:
  # los capítulos se ejecutan con construir_libro.py (jupytext + nbclient) antes de construir
  execute_notebooks: "off"
parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - colon_fence
    - deflist
    - substitution
bibtex_bibfiles:
  - references.bib
sphinx:
  config:
    language: es
    html_show_copyright: false
    bibtex_reference_style: author_year
    numfig: true
    math_numfig: true
    numfig_secnum_depth: 1
